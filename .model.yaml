configuration:
  https://schemas.dataspecer.com/documentation-generator-config/:
    partials:
      html-head: >-
        <meta charset="utf-8" />

        <title>{{translate label}}</title>

        <meta name="color-scheme" content="light dark">

        <script type="application/ld+json">
          {{{json dsv}}}
        </script>

        <script
          src="https://ofn.gov.cz/static/js/respec-odcz.js"
          class="remove"
          defer
        ></script>

        <script class="remove">
          // All config options at https://respec.org/docs/
          var respecConfig = {
            specStatus: "REC",
            publishDate: "2025-08-12",
            shortName: "dcat-ap-cz-typy-datových-sad-podle-zdroje",               
            showPreviousVersion: false,
            thisVersion: "https://ofn.gov.cz/dcat-ap-cz-typy-datových-sad-podle-zdroje/2025-08-12/",
            latestVersion: "https://ofn.gov.cz/dcat-ap-cz-typy-datových-sad-podle-zdroje/",
            editors: [{
              name: "Jakub Klímek",
              orcid: "0000-0001-7234-3051",
              company:    "Digitální a informační agentura",
              companyURL: "https://dia.gov.cz"
            }],
            inlineCSS: "true",
            github: "https://github.com/datagov-cz/otevrene-formalni-normy/",
            otherLinks: [{
                key: "Links",
                data: [{
                    value: "Portál otevřených dat",
                    href: "https://data.gov.cz"
                },{
                    value: "Kontaktní e-mail",
                    href: "mailto:otevrenadata@dia.gov.cz"
                }]
            }]
          };
        </script>


        <style>
          .figure img, .sidefigure img, figure img, .figure object, .sidefigure object, figure object, img, .img {
            max-width: 100%;
            margin: auto;
            height: auto;
          }

          table.simple {
            margin: auto;
            border-spacing: 0;
            border-collapse: collapse;
          }

          table.simple th {
            padding: 3px 10px;
            text-align: left;
          }

          table.simple td {
            border-top: 1px solid #ddd;
            padding: 3px 10px;
          }
        </style>
      specification: >-
        {{> definitions}}

        <!DOCTYPE html>

        <html {{#iflng "cs"}}lang="cs"{{lng}}lang="en"{{/iflng}}>
          <head>
            {{> html-head}}
          </head>
          <body>
            <p class="copyright"></p>
            <section id="abstract">
              {{> abstract-cs}}
            </section>

            <section>
              <h2>{{#iflng "cs"}}Přehled{{lng}}Overview{{/iflng}}</h2>

              {{#each externalArtifacts.svg}}
                <a href="{{{URL}}}">
                  <figure>
                    <img src="{{{URL}}}" alt="{{translate ./label}}" />
                    <figcaption>{{translate ./label}}</figcaption>
                  </figure>
                </a>
              {{/each}}
            </section>

            {{#if classProfilesByTags.[https://w3id.org/dsv/class-role#main]}}
              <section>
                <h2>{{#iflng "cs"}}Hlavní profily tříd{{lng}}Main class profiles{{/iflng}}</h2>

                {{#each classProfilesByTags.[https://w3id.org/dsv/class-role#main]}}
                  {{> class-profile}}
                {{/each}}
              </section>
            {{/if}}

            {{#if classProfilesByTags.[https://w3id.org/dsv/class-role#supportive]}}
              <section>
                <h2>{{#iflng "cs"}}Podpůrné profily třídy{{lng}}Supportive class profiles{{/iflng}}</h2>

                {{#each classProfilesByTags.[https://w3id.org/dsv/class-role#supportive]}}
                  {{> class-profile}}
                {{/each}}
              </section>
            {{/if}}

            {{#if (non-empty classProfilesByTags.default)}}
              <section>
                {{#if (or classProfilesByTags.[https://w3id.org/dsv/class-role#main] classProfilesByTags.[https://w3id.org/dsv/class-role#supportive])}}
                  <h2>{{#iflng "cs"}}Nezařazené profily tříd{{lng}}Other class profiles{{/iflng}}</h2>
                {{else}}
                  <h2>{{#iflng "cs"}}Profily tříd{{lng}}Class profiles{{/iflng}}</h2>
                {{/if}}

                {{#each classProfilesByTags.default}}
                  {{> class-profile}}
                {{/each}}
              </section>
            {{/if}}

            {{#if semanticEntitiesByType.classes}}
              <section>
                <h2>{{#iflng "cs"}}Třídy{{lng}}Classes{{/iflng}}</h2>

                {{#each locallyDefinedSemanticEntity}}
                  {{#ifEquals type.[0] "class"}}
                    {{> semantic-model-class}}
                  {{/ifEquals}}
                {{/each}}
              </section>
            {{/if}}

            {{#if semanticEntitiesByType.relationships}}
              <section>
                <h2>{{#iflng "cs"}}Vlastnosti{{lng}}Properties{{/iflng}}</h2>
                {{#each locallyDefinedSemanticEntity}}
                  {{#ifEquals type.[0] "relationship"}}
                    {{> semantic-model-relationship}}
                  {{/ifEquals}}
                {{/each}}
              </section>
            {{/if}}

            {{#structureModels}}
              <section>
              <h2>
                {{#iflng "cs"}}Specifikace struktury pro{{lng}}Data structure specification for{{/iflng}}
                {{translate humanLabel}}
              </h2>
              <p>{{translate humanDescription}}</p>

              {{#artifacts}}{{#getDocumentation}}{{> (useTemplate)}}{{/getDocumentation}}{{/artifacts}}
              </section>
            {{/structureModels}}

            {{> used-prefixes}}

            {{> attachments}}
          </body>
        </html>
      abstract-cs: 'Tento dokument definuje typy datových sad dle typu jejich zdroje
        pro použití v <a href="../../../dcat-ap-cz-nkd">DCAT-AP-CZ: Dokumentace
        obsahu Národního katalogu dat (NKD)</a>.'
